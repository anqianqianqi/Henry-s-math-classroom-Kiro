<!doctype html>
<meta charset="utf-8">
<title>Challenge loader — the book that draws itself</title>
<!--
  Standalone preview of components/challenge-room/ChallengeLoader.tsx.

  Same paths, same INK_DARK, same dash-offset mechanic and the same easing as
  the component; only the React and i18n plumbing is stripped. Kept next to the
  other visual previews in docs/ so the loader can be looked at without logging
  in and opening a challenge.
-->
<style>
  :root { --ink: #44403c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 50%, rgba(59,130,246,.06) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
    padding: 2rem;
  }
  h1 { font-size: 1rem; font-weight: 600; color: #6b7280; margin: 0; letter-spacing: .02em; }
  .stage { text-align: center; }
  .caption { color: #4b5563; margin: 1rem 0 0; font-weight: 500; }
  .track { margin: .75rem auto 0; width: 224px; height: 6px; border-radius: 999px; background: rgba(229,231,235,.7); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: #6ee7b7; }
  .pct { color: #9ca3af; font-size: .75rem; margin-top: .5rem; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 3rem; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .label { font-size: .7rem; color: #9ca3af; margin-top: .5rem; text-transform: uppercase; letter-spacing: .08em; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; color: #374151; }
  button:hover { background: #f9fafb; }
</style>

<h1>Challenge loader — live</h1>
<div class="stage">
  <svg id="live" viewBox="0 0 200 150" style="width:280px;height:210px"></svg>
  <p class="caption">Getting your book ready…</p>
  <div class="track"><div class="fill" id="livefill" style="width:0%"></div></div>
  <p class="pct" id="livepct">0%</p>
</div>
<button id="replay">Replay</button>

<h1>Frozen steps</h1>
<div class="row" id="steps"></div>

<script>
const LEN = 640;
const OUTLINE = [
  ['M100 40 C 78 28, 46 28, 26 36 L 26 116 C 46 108, 78 108, 100 120', 2.2, 0.9],
  ['M100 40 C 122 28, 154 28, 174 36 L 174 116 C 154 108, 122 108, 100 120', 2.2, 0.9],
  ['M100 40 L 100 120', 2.2, 0.9],
  ['M44 52 L 82 46 M44 66 L 76 61 M118 46 L 156 52 M124 61 L 156 66', 1.4, 0.55],
];
const COVERS = [
  'M100 40 C 78 28, 46 28, 26 36 L 26 116 C 46 108, 78 108, 100 120 Z',
  'M100 40 C 122 28, 154 28, 174 36 L 174 116 C 154 108, 122 108, 100 120 Z',
];

let uid = 0;
function draw(svg, shown) {
  const id = 'g' + (uid++);
  svg.innerHTML = `
    <defs>
      <clipPath id="clip${id}"><rect x="0" y="${150 - 150 * shown}" width="200" height="${150 * shown}"/></clipPath>
      <linearGradient id="cov${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fdf7e9"/><stop offset="100%" stop-color="#e8d9b8"/>
      </linearGradient>
    </defs>
    <g clip-path="url(#clip${id})">
      ${COVERS.map(d => `<path d="${d}" fill="url(#cov${id})"/>`).join('')}
    </g>
    <g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round"
       stroke-dasharray="${LEN}" stroke-dashoffset="${LEN * (1 - shown)}">
      ${OUTLINE.map(([d, w, o]) => `<path d="${d}" stroke-width="${w}" opacity="${o}"/>`).join('')}
    </g>`;
}

// Frozen steps, so the intermediate states can be judged without catching them.
const steps = document.getElementById('steps');
[0, 0.2, 0.4, 0.6, 0.8, 1].forEach(v => {
  const wrap = document.createElement('div');
  wrap.className = 'stage';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 200 150');
  svg.style.width = '150px'; svg.style.height = '112px';
  wrap.appendChild(svg);
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = Math.round(v * 100) + '%';
  wrap.appendChild(label);
  steps.appendChild(wrap);
  draw(svg, v);
});

// Live run, with the component's own smoothing: shown += (target - shown) * 0.12
const live = document.getElementById('live');
const fill = document.getElementById('livefill');
const pct  = document.getElementById('livepct');
let shown = 0, target = 0, started = 0;

function run() {
  shown = 0; target = 0; started = performance.now();
}
run();
document.getElementById('replay').onclick = run;

function tick(now) {
  // Fake an asset load: a slow chunky climb, like a 2.6 MiB GLB reporting in.
  const t = (now - started) / 3200;
  target = Math.min(1, Math.max(0, t < 0.15 ? t * 0.6 : t));
  const gap = target - shown;
  shown = Math.abs(gap) < 0.002 ? target : shown + gap * 0.12;
  draw(live, shown);
  fill.style.width = Math.round(shown * 100) + '%';
  pct.textContent = Math.round(shown * 100) + '%';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
